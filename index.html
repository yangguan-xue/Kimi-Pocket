<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kimi Pocket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0B0C10',
            cardDark: '#12141A',
            borderDark: 'rgba(255, 255, 255, 0.08)',
            cyanGlow: '#00E5FF',
            emeraldGlow: '#10B981',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B0C10;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .glow-cyan {
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.45);
    }
    .glow-emerald {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.45);
    }
    .filter-cyan-glow {
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));
    }
    .filter-emerald-glow {
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Controls for Testing in Desktop Browser -->
  <div class="fixed top-3 right-3 z-50 flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-white/70">
    <span>切换预览:</span>
    <button onclick="setOrientation('portrait')" id="btn-portrait" class="px-2 py-0.5 rounded bg-white/20 text-white font-medium">竖屏</button>
    <button onclick="setOrientation('landscape')" id="btn-landscape" class="px-2 py-0.5 rounded hover:bg-white/10 text-white/60">横屏 (三环)</button>
  </div>

  <div id="container" class="w-full max-w-sm transition-all duration-300">

    <!-- Header -->
    <header class="flex items-center justify-between mb-4 px-1">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-base font-semibold tracking-tight">Kimi Pocket</h1>
        <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-white/10 text-cyan-300 border border-cyan-400/20">Kimi Pro</span>
      </div>
      <div class="text-xs text-white/40">
        到期: 11-28 (29天)
      </div>
    </header>

    <!-- ==================== 竖屏视图 (默认) ==================== -->
    <div id="portrait-view" class="flex flex-col gap-3.5">
      
      <!-- 1. 总用量卡片 (4 段) -->
      <div class="bg-cardDark border border-borderDark rounded-2xl p-4">
        <div class="flex justify-between items-center mb-2.5">
          <span class="text-xs font-medium text-white/70">总用量 (Total Quota)</span>
          <span class="text-xs font-semibold text-cyan-300">65%</span>
        </div>
        <!-- 4 段进度条 -->
        <div class="grid grid-cols-4 gap-2 mb-2">
          <div class="h-4 rounded-full bg-cyan-400 glow-cyan"></div>
          <div class="h-4 rounded-full bg-cyan-400 glow-cyan"></div>
          <div class="h-4 rounded-full bg-cyan-400/60 glow-cyan relative overflow-hidden">
            <div class="h-full bg-cyan-400" style="width: 60%"></div>
          </div>
          <div class="h-4 rounded-full bg-white/10"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-white/40">
          <span>已用 65 / 总额 100</span>
          <span>4段阶段显示</span>
        </div>
      </div>

      <!-- 2. 周用量卡片 (7 段) -->
      <div class="bg-cardDark border border-borderDark rounded-2xl p-4">
        <div class="flex justify-between items-center mb-2.5">
          <span class="text-xs font-medium text-white/70">周用量 (Weekly Quota)</span>
          <span class="text-xs font-semibold text-emerald-400">42%</span>
        </div>
        <!-- 7 段进度条 (严格 7 段) -->
        <div class="grid grid-cols-7 gap-1.5 mb-2">
          <div class="h-4 rounded-full bg-emerald-400 glow-emerald"></div>
          <div class="h-4 rounded-full bg-emerald-400 glow-emerald"></div>
          <div class="h-4 rounded-full bg-emerald-400 glow-emerald"></div>
          <div class="h-4 rounded-full bg-white/10"></div>
          <div class="h-4 rounded-full bg-white/10"></div>
          <div class="h-4 rounded-full bg-white/10"></div>
          <div class="h-4 rounded-full bg-white/10"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-white/40">
          <span>已用 42 / 总额 100</span>
          <span class="text-emerald-400/80">3天后重置</span>
        </div>
      </div>

      <!-- 3. 5小时额度 (连续平滑单条，不拆) -->
      <div class="bg-cardDark border border-borderDark rounded-2xl p-4">
        <div class="flex justify-between items-center mb-2.5">
          <span class="text-xs font-medium text-white/70">5小时额度 (5-Hour Rolling)</span>
          <span class="text-xs font-semibold text-cyan-300">30%</span>
        </div>
        <!-- 连续单进度条 -->
        <div class="h-4 w-full bg-white/10 rounded-full overflow-hidden p-0.5 mb-2">
          <div class="h-full bg-cyan-400 glow-cyan rounded-full transition-all duration-500" style="width: 30%"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-white/40">
          <span>已用 18 / 总额 60 (剩余 42)</span>
          <span class="text-cyan-400/80">1小时42分后重置</span>
        </div>
      </div>

    </div>

    <!-- ==================== 横屏视图 (三环 HUD 仪表盘) ==================== -->
    <div id="landscape-view" class="hidden">
      <div class="grid grid-cols-3 gap-6 bg-cardDark/80 border border-borderDark rounded-3xl p-6 backdrop-blur-xl">

        <!-- 环 1: 总用量 (严格 4 段圆弧) -->
        <div class="flex flex-col items-center">
          <div class="relative w-36 h-36 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
              <!-- 背景 4 段圆弧 -->
              <!-- 周长约 282.7 (r=45), 每段约 62.6px, gap 8px -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-dasharray="62.6 8" />
              <!-- 高亮已用段 (2.6段已用) -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="#00E5FF" stroke-width="8" stroke-dasharray="183 100" class="filter-cyan-glow" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-2xl font-bold tracking-tight text-white">65%</span>
              <span class="text-[10px] text-white/40">65 / 100</span>
            </div>
          </div>
          <span class="mt-3 text-xs font-medium text-white/80">总用量</span>
          <span class="text-[10px] text-white/30">4段圆弧</span>
        </div>

        <!-- 环 2: 周用量 (严格 7 段圆弧) -->
        <div class="flex flex-col items-center">
          <div class="relative w-36 h-36 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
              <!-- 7 段圆弧: 周长 282.7, 每段 34.3px, gap 6px -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-dasharray="34.3 6" />
              <!-- 高亮已用段 (3段已用) -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="118 170" class="filter-emerald-glow" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-2xl font-bold tracking-tight text-white">42%</span>
              <span class="text-[10px] text-white/40">42 / 100</span>
            </div>
          </div>
          <span class="mt-3 text-xs font-medium text-white/80">周用量</span>
          <span class="text-[10px] text-emerald-400">3天后重置 (7段)</span>
        </div>

        <!-- 环 3: 5小时额度 (连续平滑圆弧，不拆) -->
        <div class="flex flex-col items-center">
          <div class="relative w-36 h-36 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
              <!-- 背景连续完整圆环 -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
              <!-- 高亮已用 30% (周长 282.7 * 0.3 = 84.8) -->
              <circle cx="60" cy="60" r="45" fill="none" stroke="#00E5FF" stroke-width="8" stroke-dasharray="84.8 282.7" stroke-linecap="round" class="filter-cyan-glow" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-2xl font-bold tracking-tight text-white">30%</span>
              <span class="text-[10px] text-white/40">余 42 / 60</span>
            </div>
          </div>
          <span class="mt-3 text-xs font-medium text-white/80">5小时额度</span>
          <span class="text-[10px] text-cyan-400">1h42m 后重置</span>
        </div>

      </div>
    </div>

  </div>

  <script>
    function setOrientation(mode) {
      const container = document.getElementById('container');
      const pView = document.getElementById('portrait-view');
      const lView = document.getElementById('landscape-view');
      const btnP = document.getElementById('btn-portrait');
      const btnL = document.getElementById('btn-landscape');

      if (mode === 'landscape') {
        container.className = 'w-full max-w-3xl transition-all duration-300';
        pView.classList.add('hidden');
        lView.classList.remove('hidden');
        btnL.className = 'px-2 py-0.5 rounded bg-white/20 text-white font-medium';
        btnP.className = 'px-2 py-0.5 rounded hover:bg-white/10 text-white/60';
      } else {
        container.className = 'w-full max-w-sm transition-all duration-300';
        pView.classList.remove('hidden');
        lView.classList.add('hidden');
        btnP.className = 'px-2 py-0.5 rounded bg-white/20 text-white font-medium';
        btnL.className = 'px-2 py-0.5 rounded hover:bg-white/10 text-white/60';
      }
    }

    // 监听真实设备旋转
    window.addEventListener('resize', () => {
      const isLandscape = window.innerWidth > window.innerHeight;
      if (isLandscape) {
        setOrientation('landscape');
      } else {
        setOrientation('portrait');
      }
    });

    // 初始化检测
    if (window.innerWidth > window.innerHeight) {
      setOrientation('landscape');
    }
  </script>
</body>
</html>
