name: Build macOS App

on:
  push:
    branches: [ main ]
    tags:
      - 'macos-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS Menubar App
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 Swift 环境
        run: swift --version

      - name: 运行核心单元测试
        run: |
          cd macos
          swift run TestRunner

      - name: 执行 Release 构建与安装包打包
        run: |
          bash scripts/build-macos.sh

      - name: 整理发布产物
        run: |
          mkdir -p release-output
          cp dist-macos/*.dmg release-output/ 2>/dev/null || true
          cp dist-macos/*.zip release-output/ 2>/dev/null || true
          cp dist-macos/*.sha256 release-output/ 2>/dev/null || true
          ls -la release-output/

      - name: 上传构建产物到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Pocket-macOS-Release
          path: release-output/*
          retention-days: 30

      - name: 发布 Release 并附加安装包 (若推送了 tag)
        if: startsWith(github.ref, 'refs/tags/macos-') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*
          generate_release_notes: true
