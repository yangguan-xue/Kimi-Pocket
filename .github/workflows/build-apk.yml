name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 自动接受 Android SDK 协议并确保 API 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 安装 npm 依赖
        run: npm install

      - name: 构建 Web 前端
        run: npm run build

      - name: 同步 Capacitor 原生工程与静态资源
        run: npx cap sync android

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 编译 Debug APK
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" 2>&1 | tee ../gradle_output.log

      - name: 收集失败日志并推送到分支 (若失败)
        if: failure()
        run: |
          echo "==================== BUILD FAILURE LOG ===================="
          tail -n 120 gradle_output.log || true
          echo "==========================================================="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log || true
          git add gradle_output.log || true
          git commit -m "ci: dump gradle error log" || true
          git push -f origin debug-log || true

      - name: 上传错误日志制品 (若失败)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle_output.log

      - name: 整理 APK 文件
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-${{ github.sha }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-latest.apk

      - name: 上传 APK 制品到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Pocket-APK
          path: release-output/*.apk
          retention-days: 30

      - name: 发布 Release 并附加 APK (若推送了 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
