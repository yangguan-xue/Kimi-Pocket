name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Java 17 (Zulu JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 npm 依赖
        run: npm ci

      - name: 编译前端产物并同步到 Android 原生工程
        run: npm run build:android

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 编译 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK 文件以包含版本和提交信息
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-${{ github.sha }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-latest.apk

      - name: 上传 APK 制品到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Pocket-APK
          path: release-output/*.apk
          retention-days: 30

      - name: 发布 Release 并附加 APK (若推送了 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
