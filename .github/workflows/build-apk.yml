name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Java 21 (Temurin JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 环境与缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 自动接受 Android SDK 协议
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装 npm 依赖
        run: |
          npm ci
          npx cap telemetry off || true

      - name: 编译 Web 前端
        run: npm run build

      - name: 同步前端静态资源到 Android 工程
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 编译 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 整理 APK 文件
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-${{ github.sha }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Kimi-Pocket-latest.apk

      - name: 上传 APK 制品到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Pocket-APK
          path: release-output/*.apk
          retention-days: 30

      - name: 发布 Release 并附加 APK (若推送了 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
